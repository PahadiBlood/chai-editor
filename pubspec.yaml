name: chai_editor
description: A document editor for macOS. Opens, edits and saves Markdown files.
publish_to: "none"
version: 1.2.0+4

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.32.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # Pinned 6.1.0 with a Flutter text-input compatibility patch; see PATCHES.md.
  appflowy_editor:
    path: third_party/appflowy_editor
  file_picker: ^10.3.10
  markdown: ^7.2.1
  html: ^0.15.7
  provider: ^6.0.5
  path_provider: ^2.1.6
  path: ^1.9.1
  url_launcher: ^6.3.3
  pdf: ^3.13.1
  archive: ^4.7.1
  xml: ^7.0.1
  re_highlight: ^0.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/
