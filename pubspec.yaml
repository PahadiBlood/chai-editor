name: chai_editor
description: A document editor for macOS. Opens, edits and saves Markdown files.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.32.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # Pinned 6.1.0 with a Flutter text-input compatibility patch; see PATCHES.md.
  appflowy_editor:
    path: third_party/appflowy_editor
  file_picker: ^10.3.10
  markdown: ^7.2.1
  html: ^0.15.7
  provider: ^6.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
